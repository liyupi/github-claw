<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多媒体处理平台</title>
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4.3.0/dist/vue-router.global.prod.js"></script>
  <script src="https://unpkg.com/axios@1.7.2/dist/axios.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Nav */
    .nav { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; height: 64px; gap: 2rem; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .nav-brand { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: .5rem; }
    .nav-brand svg { width: 28px; height: 28px; }
    .nav-links { display: flex; gap: .25rem; }
    .nav-links a { text-decoration: none; padding: .5rem 1rem; border-radius: 8px; color: var(--text-secondary); font-weight: 500; font-size: .9rem; transition: all .2s; }
    .nav-links a:hover, .nav-links a.router-link-active { background: #eef2ff; color: var(--primary); }

    /* Layout */
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
    .card { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    h2 { font-size: 1.5rem; margin-bottom: 1.25rem; }
    h3 { font-size: 1.1rem; margin-bottom: .75rem; color: var(--text-secondary); }

    /* Form */
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: .4rem; font-size: .9rem; }
    .form-group select, .form-group input[type="range"], .form-group input[type="text"] {
      width: 100%; padding: .6rem .75rem; border: 1px solid var(--border); border-radius: 8px; font-size: .9rem; outline: none; transition: border-color .2s;
    }
    .form-group select:focus, .form-group input:focus { border-color: var(--primary); }
    .range-value { font-size: .85rem; color: var(--text-secondary); margin-top: .25rem; }

    /* Upload area */
    .upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 2.5rem 1.5rem; text-align: center; cursor: pointer; transition: all .2s; position: relative; }
    .upload-area:hover, .upload-area.drag-over { border-color: var(--primary); background: #eef2ff; }
    .upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-icon { font-size: 2.5rem; margin-bottom: .5rem; }
    .upload-text { color: var(--text-secondary); font-size: .9rem; }
    .file-name { margin-top: .5rem; font-weight: 600; color: var(--primary); word-break: break-all; }

    /* Button */
    .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .7rem 1.5rem; border: none; border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; transition: all .15s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #059669; }
    .btn-sm { padding: .4rem .9rem; font-size: .85rem; }

    /* Result */
    .result { margin-top: 1.5rem; padding: 1.25rem; border-radius: 8px; }
    .result.success { background: #ecfdf5; border: 1px solid #a7f3d0; }
    .result.error { background: #fef2f2; border: 1px solid #fecaca; }
    .result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; font-size: .9rem; }
    .result-row:last-child { margin-bottom: 0; }
    .result-label { color: var(--text-secondary); }
    .result-value { font-weight: 600; }
    .savings { color: var(--success); font-weight: 700; }

    /* Operation toggle */
    .op-toggle { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
    .op-toggle button { flex: 1; padding: .6rem; border: 2px solid var(--border); border-radius: 8px; background: var(--card-bg); font-weight: 600; font-size: .9rem; cursor: pointer; transition: all .2s; }
    .op-toggle button.active { border-color: var(--primary); background: #eef2ff; color: var(--primary); }

    /* Task history */
    .task-list { display: flex; flex-direction: column; gap: .5rem; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: .75rem 1rem; border: 1px solid var(--border); border-radius: 8px; font-size: .85rem; }
    .task-status { padding: .15rem .6rem; border-radius: 99px; font-size: .75rem; font-weight: 600; }
    .task-status.completed { background: #ecfdf5; color: #059669; }
    .task-status.failed { background: #fef2f2; color: #dc2626; }
    .task-status.processing { background: #eff6ff; color: #2563eb; }

    /* Home page */
    .hero { text-align: center; padding: 3rem 0 2rem; }
    .hero h1 { font-size: 2.2rem; margin-bottom: .75rem; }
    .hero p { color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 2rem; }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; }
    .feature-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; text-align: center; transition: box-shadow .2s; }
    .feature-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .feature-icon { font-size: 2.5rem; margin-bottom: .75rem; }
    .feature-card h3 { color: var(--text); margin-bottom: .4rem; }
    .feature-card p { color: var(--text-secondary); font-size: .85rem; }
    .feature-card a { display: inline-block; margin-top: .75rem; color: var(--primary); font-weight: 600; text-decoration: none; font-size: .9rem; }

    /* Loading */
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #e5e7eb; border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <!-- Navigation -->
    <nav class="nav">
      <router-link to="/" class="nav-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="3"/><path d="M2 12h3M19 12h3M12 2v3M12 19v3"/></svg>
        多媒体处理平台
      </router-link>
      <div class="nav-links">
        <router-link to="/">首页</router-link>
        <router-link to="/image">图片处理</router-link>
        <router-link to="/audio">音频处理</router-link>
        <router-link to="/video">视频处理</router-link>
        <router-link to="/history">处理记录</router-link>
      </div>
    </nav>

    <div class="container">
      <router-view></router-view>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/api';

    // ─── Home Page ────────────────────────────────────────
    const HomePage = {
      template: `
        <div>
          <div class="hero">
            <h1>🎬 多媒体处理平台</h1>
            <p>一站式图片、音频、视频压缩与格式转换工具</p>
          </div>
          <div class="features">
            <div class="feature-card">
              <div class="feature-icon">🖼️</div>
              <h3>图片处理</h3>
              <p>支持 JPG、PNG、WebP、BMP、GIF、TIFF 等格式的压缩与转换</p>
              <router-link to="/image">开始使用 →</router-link>
            </div>
            <div class="feature-card">
              <div class="feature-icon">🎵</div>
              <h3>音频处理</h3>
              <p>支持 MP3、WAV、OGG、AAC、FLAC、M4A 等格式的压缩与转换</p>
              <router-link to="/audio">开始使用 →</router-link>
            </div>
            <div class="feature-card">
              <div class="feature-icon">🎥</div>
              <h3>视频处理</h3>
              <p>支持 MP4、WebM、AVI、MKV、MOV、FLV 等格式的压缩与转换</p>
              <router-link to="/video">开始使用 →</router-link>
            </div>
          </div>
        </div>
      `
    };

    // ─── Shared upload mixin-like composable ──────────────
    function useMediaProcessor(mediaType, endpoint) {
      return {
        data() {
          return {
            file: null,
            fileName: '',
            operation: 'compress',
            outputFormat: '',
            formats: [],
            quality: 85,
            bitrate: '128k',
            crf: 28,
            resolution: '',
            processing: false,
            result: null,
            error: null,
            dragOver: false,
          };
        },
        async created() {
          try {
            const resp = await axios.get(API + '/formats');
            this.formats = resp.data[mediaType];
            if (this.formats.length) this.outputFormat = this.formats[0];
          } catch(e) { console.error(e); }
        },
        methods: {
          onFileChange(e) {
            const f = e.target.files[0];
            if (f) { this.file = f; this.fileName = f.name; this.result = null; this.error = null; }
          },
          onDrop(e) {
            this.dragOver = false;
            const f = e.dataTransfer.files[0];
            if (f) { this.file = f; this.fileName = f.name; this.result = null; this.error = null; }
          },
          formatSize(bytes) {
            if (!bytes) return '-';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
            return (bytes/1024/1024).toFixed(2) + ' MB';
          },
          async submit() {
            if (!this.file) return;
            this.processing = true; this.result = null; this.error = null;
            const fd = new FormData();
            fd.append('file', this.file);
            fd.append('format', this.outputFormat);
            fd.append('operation', this.operation);
            if (mediaType === 'image') fd.append('quality', this.quality);
            if (mediaType === 'audio') fd.append('bitrate', this.bitrate);
            if (mediaType === 'video') { fd.append('crf', this.crf); if (this.resolution) fd.append('resolution', this.resolution); }
            try {
              const resp = await axios.post(API + endpoint, fd);
              const task = resp.data;
              if (task.status === 'processing') {
                this.result = task;
                await this.pollTask(task.id);
              } else {
                this.result = task;
              }
            } catch(e) {
              this.error = e.response?.data?.error || e.message;
            }
            this.processing = false;
          },
          async pollTask(taskId) {
            const maxAttempts = 600;
            for (let i = 0; i < maxAttempts; i++) {
              await new Promise(r => setTimeout(r, 1500));
              try {
                const resp = await axios.get(API + '/tasks/' + taskId);
                this.result = resp.data;
                if (resp.data.status === 'completed') return;
                if (resp.data.status === 'failed') {
                  this.error = resp.data.errorMessage || '处理失败';
                  return;
                }
              } catch(e) { /* retry */ }
            }
            this.error = '处理超时，请在历史记录中查看结果';
          },
          download() {
            if (this.result) window.open(API.replace('/api','') + '/api/download/' + this.result.id);
          }
        }
      };
    }

    // ─── Image Page ───────────────────────────────────────
    const ImagePage = {
      ...useMediaProcessor('image', '/process/image'),
      template: `
        <div>
          <h2>🖼️ 图片处理</h2>
          <div class="card">
            <div class="op-toggle">
              <button :class="{active: operation==='compress'}" @click="operation='compress'">压缩</button>
              <button :class="{active: operation==='convert'}" @click="operation='convert'">格式转换</button>
            </div>
            <div class="upload-area" :class="{'drag-over': dragOver}" @dragover.prevent="dragOver=true" @dragleave="dragOver=false" @drop.prevent="onDrop">
              <input type="file" accept="image/*" @change="onFileChange" />
              <div class="upload-icon">📁</div>
              <div class="upload-text">点击或拖拽图片到此处上传</div>
              <div v-if="fileName" class="file-name">{{ fileName }}</div>
            </div>
            <div class="form-group" style="margin-top:1.25rem">
              <label>输出格式</label>
              <select v-model="outputFormat">
                <option v-for="f in formats" :key="f" :value="f">{{ f.toUpperCase() }}</option>
              </select>
            </div>
            <div class="form-group">
              <label>质量 ({{ quality }}%)</label>
              <input type="range" min="1" max="100" v-model.number="quality" />
              <div class="range-value">值越低文件越小，画质越低</div>
            </div>
            <button class="btn btn-primary" :disabled="!file || processing" @click="submit">
              <span v-if="processing" class="spinner"></span>
              {{ processing ? '处理中...' : '开始处理' }}
            </button>
            <div v-if="result && result.status === 'processing'" class="result" style="background:#eff6ff;border-left:4px solid #2563eb;">
              <div class="result-row"><span class="result-label">状态</span><span class="result-value">⏳ 处理中...</span></div>
              <div class="result-row"><span class="result-label">原始大小</span><span class="result-value">{{ formatSize(result.fileSizeBefore) }}</span></div>
            </div>
            <div v-if="result && result.status === 'completed'" class="result success">
              <div class="result-row"><span class="result-label">状态</span><span class="result-value">✅ 处理完成</span></div>
              <div class="result-row"><span class="result-label">原始大小</span><span class="result-value">{{ formatSize(result.fileSizeBefore) }}</span></div>
              <div class="result-row"><span class="result-label">处理后大小</span><span class="result-value">{{ formatSize(result.fileSizeAfter) }}</span></div>
              <div v-if="result.fileSizeBefore && result.fileSizeAfter" class="result-row">
                <span class="result-label">压缩率</span>
                <span class="savings">{{ ((1 - result.fileSizeAfter/result.fileSizeBefore)*100).toFixed(1) }}%</span>
              </div>
              <div style="margin-top:.75rem"><button class="btn btn-success btn-sm" @click="download">📥 下载文件</button></div>
            </div>
            <div v-if="error" class="result error">❌ {{ error }}</div>
          </div>
        </div>
      `
    };

    // ─── Audio Page ───────────────────────────────────────
    const AudioPage = {
      ...useMediaProcessor('audio', '/process/audio'),
      template: `
        <div>
          <h2>🎵 音频处理</h2>
          <div class="card">
            <div class="op-toggle">
              <button :class="{active: operation==='compress'}" @click="operation='compress'">压缩</button>
              <button :class="{active: operation==='convert'}" @click="operation='convert'">格式转换</button>
            </div>
            <div class="upload-area" :class="{'drag-over': dragOver}" @dragover.prevent="dragOver=true" @dragleave="dragOver=false" @drop.prevent="onDrop">
              <input type="file" accept="audio/*" @change="onFileChange" />
              <div class="upload-icon">🎧</div>
              <div class="upload-text">点击或拖拽音频文件到此处上传</div>
              <div v-if="fileName" class="file-name">{{ fileName }}</div>
            </div>
            <div class="form-group" style="margin-top:1.25rem">
              <label>输出格式</label>
              <select v-model="outputFormat">
                <option v-for="f in formats" :key="f" :value="f">{{ f.toUpperCase() }}</option>
              </select>
            </div>
            <div class="form-group">
              <label>比特率</label>
              <select v-model="bitrate">
                <option value="64k">64 kbps (低质量/小体积)</option>
                <option value="128k">128 kbps (标准)</option>
                <option value="192k">192 kbps (高质量)</option>
                <option value="256k">256 kbps (很高质量)</option>
                <option value="320k">320 kbps (最高质量)</option>
              </select>
            </div>
            <button class="btn btn-primary" :disabled="!file || processing" @click="submit">
              <span v-if="processing" class="spinner"></span>
              {{ processing ? '处理中...' : '开始处理' }}
            </button>
            <div v-if="result && result.status === 'processing'" class="result" style="background:#eff6ff;border-left:4px solid #2563eb;">
              <div class="result-row"><span class="result-label">状态</span><span class="result-value">⏳ 处理中...</span></div>
              <div class="result-row"><span class="result-label">原始大小</span><span class="result-value">{{ formatSize(result.fileSizeBefore) }}</span></div>
            </div>
            <div v-if="result && result.status === 'completed'" class="result success">
              <div class="result-row"><span class="result-label">状态</span><span class="result-value">✅ 处理完成</span></div>
              <div class="result-row"><span class="result-label">原始大小</span><span class="result-value">{{ formatSize(result.fileSizeBefore) }}</span></div>
              <div class="result-row"><span class="result-label">处理后大小</span><span class="result-value">{{ formatSize(result.fileSizeAfter) }}</span></div>
              <div v-if="result.fileSizeBefore && result.fileSizeAfter" class="result-row">
                <span class="result-label">大小变化</span>
                <span class="savings">{{ ((1 - result.fileSizeAfter/result.fileSizeBefore)*100).toFixed(1) }}%</span>
              </div>
              <div style="margin-top:.75rem"><button class="btn btn-success btn-sm" @click="download">📥 下载文件</button></div>
            </div>
            <div v-if="error" class="result error">❌ {{ error }}</div>
          </div>
        </div>
      `
    };

    // ─── Video Page ───────────────────────────────────────
    const VideoPage = {
      ...useMediaProcessor('video', '/process/video'),
      template: `
        <div>
          <h2>🎥 视频处理</h2>
          <div class="card">
            <div class="op-toggle">
              <button :class="{active: operation==='compress'}" @click="operation='compress'">压缩</button>
              <button :class="{active: operation==='convert'}" @click="operation='convert'">格式转换</button>
            </div>
            <div class="upload-area" :class="{'drag-over': dragOver}" @dragover.prevent="dragOver=true" @dragleave="dragOver=false" @drop.prevent="onDrop">
              <input type="file" accept="video/*" @change="onFileChange" />
              <div class="upload-icon">🎬</div>
              <div class="upload-text">点击或拖拽视频文件到此处上传</div>
              <div v-if="fileName" class="file-name">{{ fileName }}</div>
            </div>
            <div class="form-group" style="margin-top:1.25rem">
              <label>输出格式</label>
              <select v-model="outputFormat">
                <option v-for="f in formats" :key="f" :value="f">{{ f.toUpperCase() }}</option>
              </select>
            </div>
            <div class="form-group">
              <label>画质 CRF ({{ crf }}) — 值越大压缩越多</label>
              <input type="range" min="0" max="51" v-model.number="crf" />
              <div class="range-value">0 = 无损，28 = 默认，51 = 最低画质</div>
            </div>
            <div class="form-group">
              <label>分辨率（可选，如 1280x720）</label>
              <input type="text" v-model="resolution" placeholder="留空保持原分辨率" />
            </div>
            <button class="btn btn-primary" :disabled="!file || processing" @click="submit">
              <span v-if="processing" class="spinner"></span>
              {{ processing ? '处理中...' : '开始处理' }}
            </button>
            <div v-if="result && result.status === 'processing'" class="result" style="background:#eff6ff;border-left:4px solid #2563eb;">
              <div class="result-row"><span class="result-label">状态</span><span class="result-value">⏳ 处理中...</span></div>
              <div class="result-row"><span class="result-label">原始大小</span><span class="result-value">{{ formatSize(result.fileSizeBefore) }}</span></div>
            </div>
            <div v-if="result && result.status === 'completed'" class="result success">
              <div class="result-row"><span class="result-label">状态</span><span class="result-value">✅ 处理完成</span></div>
              <div class="result-row"><span class="result-label">原始大小</span><span class="result-value">{{ formatSize(result.fileSizeBefore) }}</span></div>
              <div class="result-row"><span class="result-label">处理后大小</span><span class="result-value">{{ formatSize(result.fileSizeAfter) }}</span></div>
              <div v-if="result.fileSizeBefore && result.fileSizeAfter" class="result-row">
                <span class="result-label">压缩率</span>
                <span class="savings">{{ ((1 - result.fileSizeAfter/result.fileSizeBefore)*100).toFixed(1) }}%</span>
              </div>
              <div style="margin-top:.75rem"><button class="btn btn-success btn-sm" @click="download">📥 下载文件</button></div>
            </div>
            <div v-if="error" class="result error">❌ {{ error }}</div>
          </div>
        </div>
      `
    };

    // ─── History Page ─────────────────────────────────────
    const HistoryPage = {
      data() { return { tasks: [], loading: true }; },
      async created() {
        try { this.tasks = (await axios.get(API + '/tasks')).data; } catch(e) { console.error(e); }
        this.loading = false;
      },
      methods: {
        formatSize(bytes) {
          if (!bytes) return '-';
          if (bytes < 1024) return bytes + ' B';
          if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
          return (bytes/1024/1024).toFixed(2) + ' MB';
        },
        download(id) { window.open(API.replace('/api','') + '/api/download/' + id); },
        mediaIcon(t) { return {image:'🖼️',audio:'🎵',video:'🎥'}[t]||'📄'; },
        opLabel(o) { return o === 'compress' ? '压缩' : '转换'; },
      },
      template: `
        <div>
          <h2>📋 处理记录</h2>
          <div class="card">
            <div v-if="loading" style="text-align:center;padding:2rem"><span class="spinner"></span></div>
            <div v-else-if="tasks.length===0" style="text-align:center;color:var(--text-secondary);padding:2rem">暂无处理记录</div>
            <div v-else class="task-list">
              <div class="task-item" v-for="t in tasks" :key="t.id">
                <div style="display:flex;align-items:center;gap:.75rem">
                  <span>{{ mediaIcon(t.mediaType) }}</span>
                  <div>
                    <div style="font-weight:600">{{ t.filename }}</div>
                    <div style="font-size:.8rem;color:var(--text-secondary)">{{ opLabel(t.operation) }} → {{ t.outputFormat?.toUpperCase() }} · {{ formatSize(t.fileSizeBefore) }} → {{ formatSize(t.fileSizeAfter) }}</div>
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:.75rem">
                  <span class="task-status" :class="t.status">{{ t.status === 'completed' ? '完成' : t.status === 'failed' ? '失败' : '处理中' }}</span>
                  <button v-if="t.status==='completed'" class="btn btn-success btn-sm" @click="download(t.id)">📥</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `
    };

    // ─── Router & App ─────────────────────────────────────
    const routes = [
      { path: '/', component: HomePage },
      { path: '/image', component: ImagePage },
      { path: '/audio', component: AudioPage },
      { path: '/video', component: VideoPage },
      { path: '/history', component: HistoryPage },
    ];
    const router = VueRouter.createRouter({
      history: VueRouter.createWebHashHistory(),
      routes,
    });
    const app = Vue.createApp({});
    app.use(router);
    app.mount('#app');
  </script>
</body>
</html>
